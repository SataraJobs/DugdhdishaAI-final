<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DugdhdishaAI - फोटो अपलोड</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">
    
    <!-- 🔥 FIREBASE SDK 🔥 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #e8f5e9; }
        .box { background: white; padding: 30px 20px; border-radius: 20px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); position: relative; }
        h2 { color: #1b5e20; margin: 0 0 5px 0; font-weight: 900; font-size: 26px;}
        .subtitle { font-size: 13px; color: #666; margin-bottom: 20px; font-weight: bold;}
        
        .input-group { text-align: left; margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; font-weight: bold; color: #444; margin-bottom: 5px; }
        input[type="file"] { width: 100%; padding: 10px; border: 1px dashed #2e7d32; border-radius: 10px; background: #f1f8e9; box-sizing: border-box; }
        
        .btn { background: linear-gradient(145deg, #2e7d32, #1b5e20); color: white; padding: 15px 20px; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; margin-top: 10px; transition: 0.3s; box-shadow: 0 4px 0 #1b5e20;}
        .btn:active { top: 4px; box-shadow: 0 0 0 #1b5e20; position: relative; }
        
        #preview { width: 100%; margin-top: 20px; border-radius: 10px; display: none; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border: 2px solid #e8f5e9;}
        #status { font-size: 13px; font-weight: bold; color: #1565c0; margin-top: 15px; }

        /* 🔥 NEW: Live Session Security Alert Popup Style 🔥 */
        #sessionAlertBox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .session-alert-content {
            background: white; padding: 25px; border-radius: 15px;
            max-width: 85%; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body onload="initTestUploadPage()">

    <!-- 🔥 NEW: Live Session Security Alert Popup 🔥 -->
    <div id="sessionAlertBox">
        <div class="session-alert-content">
            <h3 style="color: #d32f2f; margin-top: 0;">⚠️ सुरक्षा सूचना!</h3>
            <p style="font-size: 14px; color: #333;">तुमच्या खात्यावर दुसऱ्या डिव्हाईसवरून लॉगिन झाले आहे. सुरक्षा कारणास्तव या डिव्हाईसवरून ३ सेकंदांत स्वयंचलित लॉग-आऊट होत आहे...</p>
        </div>
    </div>

    <div class="box">
        <h2>DugdhdishaAI 🐄</h2>
        <div class="subtitle">क्लाउड फोटो अपलोड टेस्ट ☁️</div>
        
        <div class="input-group">
            <label>मोबाईलमधील फोटो निवडा:</label>
            <input type="file" id="imageInput" accept="image/*">
        </div>
        
        <button class="btn" onclick="uploadImage()">क्लाउडवर अपलोड करा 🚀</button>
        
        <p id="status"></p>
        <img id="preview" src="" alt="अपलोड केलेला फोटो">
    </div>

    <script>
        // 🔥 FIREBASE INITIALIZATION 🔥
        const firebaseConfig = {
            apiKey: "AIzaSyBiqbXWMpD19u-RaYZEUicHmxO8JRk_Glo",
            authDomain: "dugdhdishaai.firebaseapp.com",
            projectId: "dugdhdishaai",
            storageBucket: "dugdhdishaai.firebasestorage.app",
            messagingSenderId: "1059551640041",
            appId: "1:1059551640041:web:3fc95210b95b1319c6b378",
            measurementId: "G-6TFEJKBVFL"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // --- 🔥 NEW: PAGE INIT & CLOUD SECURITY WATCHER 🔥 ---
        function initTestUploadPage() {
            syncUserSessionFromCloud();
        }

        // --- 🔥 NEW: CLOUD DATABASE SESSION WATCHER (onSnapshot) 🔥 ---
        function syncUserSessionFromCloud() {
            let userMobile = localStorage.getItem("current_user_mobile");
            if (userMobile && userMobile !== "+91 9XXXX XXXX") {
                db.collection("users").doc(userMobile).onSnapshot((doc) => {
                    if (doc.exists && doc.data()) {
                        let cloudData = doc.data();
                        let localSessionId = localStorage.getItem("current_session_id") || localStorage.getItem("currentSessionId");
                        let cloudSessionId = cloudData.currentSessionId;
                        if (cloudSessionId && localSessionId && cloudSessionId !== localSessionId) {
                            let alertBox = document.getElementById("sessionAlertBox");
                            if (alertBox) alertBox.style.display = "flex";
                            setTimeout(() => {
                                localStorage.clear();
                                window.location.replace("login.html");
                            }, 3000);
                        }
                    }
                }, (err) => console.log("Cloud security watcher error:", err));
            }
        }

        function uploadImage() {
            const fileInput = document.getElementById('imageInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert("कृपया आधी एक फोटो निवडा!");
                return;
            }

            // युजरला प्रोग्रेस दाखवणे
            const statusText = document.getElementById('status');
            statusText.innerText = "DugdhdishaAI सर्व्हरवर फोटो अपलोड होत आहे... ⏳";
            statusText.style.color = "#f57c00";

            // डेटा तयार करणे
            const formData = new FormData();
            formData.append("file", file);
            
            // ⚠️ तुम्ही Cloudinary मध्ये सेव्ह केलेले Upload Preset चे नाव इथे टाका
            // जर तुम्ही 'dugdh_preset' नाव दिले असेल तर असेच राहू द्या.
            formData.append("upload_preset", "DugdhdishaAI");
            // तुमचा Cloudinary चा खरा URL (csahcejo हे तुमचे Cloud Name आहे)
            const cloudinaryUrl = "https://api.cloudinary.com/v1_1/csahcejo/image/upload";

            // सर्व्हरवर फोटो पाठवणे (API Call)
            fetch(cloudinaryUrl, {
                method: "POST",
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if(data.secure_url) {
                    statusText.innerText = "✅ फोटो यशस्वीरित्या क्लाउडवर सेव्ह झाला!";
                    statusText.style.color = "#2e7d32";
                    
                    // फोटो स्क्रीनवर दाखवणे
                    const imgPreview = document.getElementById('preview');
                    imgPreview.src = data.secure_url;
                    imgPreview.style.display = "block";
                    
                    console.log("DugdhdishaAI फोटो लिंक:", data.secure_url);

                    // 🔥 FIREBASE: अपलोड केलेल्या फोटोची लिंक क्लाऊडवर सेव्ह करा (`test_uploaded_photos`) 🔥
                    let fName = localStorage.getItem("current_user_name") || "वापरकर्ता";
                    let fMob = localStorage.getItem("current_user_mobile") || "अज्ञात";
                    
                    db.collection("test_uploaded_photos").add({
                        farmerName: fName,
                        farmerMobile: fMob,
                        imageUrl: data.secure_url,
                        fileName: file.name || "photo.jpg",
                        date: new Date().toLocaleDateString('mr-IN'),
                        timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    }).catch(e => console.error("Cloud photo log error:", e));

                    alert("अभिनंदन! DugdhdishaAI मध्ये फोटो अपलोड झाला.\n\nही तुमची लिंक आहे:\n" + data.secure_url);
                } else {
                    statusText.innerText = "❌ अपलोड फेल झाले. Preset Name बरोबर आहे का तपासा.";
                    statusText.style.color = "red";
                    console.error("Cloudinary Error:", data);
                }
            })
            .catch(error => {
                console.error("Error:", error);
                statusText.innerText = "❌ इंटरनेट एरर आला.";
                statusText.style.color = "red";
            });
        }
    </script>
    
    <script src="fcm_setup.js"></script>
</body>
</html>
