<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>सूचना | दुग्ध दिशा AI</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1b5e20">

    <!-- 🔥 FIREBASE SDK 🔥 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7f6;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }
        .notif-page {
            max-width: 600px;
            margin: 0 auto;
        }
        .notif-card {
            background: #fff;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border-left: 5px solid #2e7d32;
        }
        .notif-card h4 {
            margin: 0 0 5px;
            color: #1b5e20;
            font-size: 16px;
        }
        .notif-card p {
            margin: 0;
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }
        .notif-time {
            font-size: 11px;
            color: #888;
            display: block;
            margin-top: 8px;
        }
        .back-btn {
            background: #1b5e20;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-block;
        }
        .clear-btn {
            background: #d32f2f;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            float: right;
            margin-bottom: 15px;
        }
        .empty-msg {
            text-align: center;
            color: #888;
            margin-top: 30px;
            font-size: 16px;
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        h2 {
            color: #1b5e20;
            margin: 0;
            font-size: 22px;
        }

        /* 🔥 NEW: Live Session Security Alert Popup Style 🔥 */
        #sessionAlertBox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .session-alert-content {
            background: white; padding: 25px; border-radius: 15px;
            max-width: 85%; box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body onload="initNotificationsPage()">

<!-- 🔥 NEW: Live Session Security Alert Popup 🔥 -->
<div id="sessionAlertBox">
    <div class="session-alert-content">
        <h3 style="color: #d32f2f; margin-top: 0;">⚠️ सुरक्षा सूचना!</h3>
        <p style="font-size: 14px; color: #333;">तुमच्या खात्यावर दुसऱ्या डिव्हाईसवरून लॉगिन झाले आहे. सुरक्षा कारणास्तव या डिव्हाईसवरून ३ सेकंदांत स्वयंचलित लॉग-आऊट होत आहे...</p>
    </div>
</div>

    <div class="notif-page">
        <div class="header-area">
            <button class="back-btn" onclick="history.back()">⬅️ मागे</button>
            <h2>📢 सर्व सूचना</h2>
            <button class="clear-btn" onclick="clearMyNotifications()">सर्व साफ करा</button>
        </div>
        <div id="notif_container"></div>
    </div>

    <!-- 🔥 FIREBASE SDK 🔥 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <script>
        // 🔥 FIREBASE INITIALIZATION 🔥
        const firebaseConfig = {
            apiKey: "AIzaSyBiqbXWMpD19u-RaYZEUicHmxO8JRk_Glo",
            authDomain: "dugdhdishaai.firebaseapp.com",
            projectId: "dugdhdishaai",
            storageBucket: "dugdhdishaai.firebasestorage.app",
            messagingSenderId: "1059551640041",
            appId: "1:1059551640041:web:3fc95210b95b1319c6b378",
            measurementId: "G-6TFEJKBVFL"
        };
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // वर्तमान युजरची भूमिका (role)
        const CURRENT_ROLE = localStorage.getItem("current_logged_in_role") || 'farmer';
        const EIGHT_DAYS_MS = 8 * 24 * 60 * 60 * 1000;

        // --- 🔥 NEW: PAGE INIT & CLOUD SECURITY WATCHER 🔥 ---
        function initNotificationsPage() {
            syncNotificationsFromCloud();
            loadNotificationsPage();
        }

        // --- 🔥 NEW: CLOUD DATABASE SYNC (REAL-TIME SNAPSHOT) & SINGLE-DEVICE SECURITY 🔥 ---
        function syncNotificationsFromCloud() {
            let userMobile = localStorage.getItem("current_user_mobile");
            if (!userMobile || userMobile === "+91 9XXXX XXXX") return;

            // १. सिंगल डिव्हाईस सेशन वॉचर (सुरक्षा)
            db.collection("users").doc(userMobile).onSnapshot((doc) => {
                if (doc.exists && doc.data()) {
                    let cloudData = doc.data();
                    let localSessionId = localStorage.getItem("current_session_id") || localStorage.getItem("currentSessionId");
                    let cloudSessionId = cloudData.currentSessionId;
                    if (cloudSessionId && localSessionId && cloudSessionId !== localSessionId) {
                        let alertBox = document.getElementById("sessionAlertBox");
                        if (alertBox) alertBox.style.display = "flex";
                        setTimeout(() => {
                            localStorage.clear();
                            window.location.replace("login.html");
                        }, 3000);
                    }
                }
            }, (err) => console.log("Cloud user sync error:", err));

            // २. क्लाऊडवरून 'Broadcast' नोटिफिकेशन्स आणा (`broadcast_notifications` - REAL-TIME)
            db.collection("broadcast_notifications").onSnapshot((querySnapshot) => {
                let cloudNotifs = JSON.parse(localStorage.getItem('system_notifications')) || [];
                querySnapshot.forEach((doc) => {
                    let cData = doc.data();
                    if(cData.target === 'all' || cData.target === CURRENT_ROLE) {
                        let exists = cloudNotifs.some(n => n.message === cData.message && n.title === cData.title);
                        if (!exists) {
                            cloudNotifs.push(cData);
                        }
                    }
                });
                localStorage.setItem('system_notifications', JSON.stringify(cloudNotifs));
                loadNotificationsPage();
            }, e => console.log("Cloud broadcast sync error:", e));

            // ३. क्लाऊडवरून 'Personal' नोटिफिकेशन्स आणा (`app_notifications` - REAL-TIME)
            db.collection("app_notifications")
            .where("receiver_mobile", "==", userMobile)
            .onSnapshot((querySnapshot) => {
                let cloudNotifs = JSON.parse(localStorage.getItem('system_notifications')) || [];
                querySnapshot.forEach((doc) => {
                    let cData = doc.data();
                    let exists = cloudNotifs.some(n => n.message === cData.message && n.title === cData.title);
                    if (!exists) {
                        cloudNotifs.push(cData);
                    }
                });
                localStorage.setItem('system_notifications', JSON.stringify(cloudNotifs));
                loadNotificationsPage();
            }, e => console.log("Cloud private notifications sync error:", e));
        }

        // 8 दिवस जुन्या नोटिफिकेशन्स आपोआप हटवा आणि उरलेली दाखवा
        function loadNotificationsPage() {
            let allNotifs = JSON.parse(localStorage.getItem('system_notifications')) || [];
            let now = Date.now();

            // 8 दिवसांपेक्षा जुनी काढा
            let freshNotifs = allNotifs.filter(n => {
                let notifTime = new Date(n.timestamp || n.date).getTime(); // सपोर्ट जुन्या/नवीन की
                return (now - notifTime) < EIGHT_DAYS_MS;
            });

            // जर फिल्टर केल्याने काही काढली असतील तर localStorage अपडेट करा
            if (freshNotifs.length !== allNotifs.length) {
                localStorage.setItem('system_notifications', JSON.stringify(freshNotifs));
            }

            // फक्त या युजरसाठी (त्याच्या role किंवा 'all' साठी किंवा त्याच्या मोबाईलसाठी) असलेली नोटिफिकेशन्स
            let myNotifs = freshNotifs.filter(n => 
                n.target === CURRENT_ROLE || 
                n.target === 'all' || 
                n.receiver_mobile === localStorage.getItem("current_user_mobile")
            );

            // नवीनतम वर दिसावी म्हणून उतरता क्रम
            myNotifs.sort((a, b) => new Date(b.timestamp || b.date) - new Date(a.timestamp || a.date));

            let container = document.getElementById('notif_container');
            if (myNotifs.length === 0) {
                container.innerHTML = '<div class="empty-msg">कोणतीही सूचना नाही.</div>';
                return;
            }

            let html = '';
            myNotifs.forEach(n => {
                let timeStr = n.time || '';
                if (n.timestamp) {
                    timeStr = new Date(n.timestamp).toLocaleString('mr-IN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                } else if (n.date) {
                    timeStr = new Date(n.date).toLocaleString('mr-IN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                }
                html += `
                    <div class="notif-card">
                        <h4>${n.title || 'सूचना'}</h4>
                        <p>${n.message || ''}</p>
                        <span class="notif-time">⏰ ${timeStr}</span>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // फक्त या युजरच्या नोटिफिकेशन्स क्लिअर करा (बाकीच्या भूमिकांना त्रास होणार नाही)
        function clearMyNotifications() {
            if (!confirm("तुम्हाला खात्री आहे? सर्व सूचना कायमच्या हटवल्या जातील.")) return;

            let allNotifs = JSON.parse(localStorage.getItem('system_notifications')) || [];
            let userMobile = localStorage.getItem("current_user_mobile");
            
            // इतर भूमिकांच्या नोटिफिकेशन्स ठेवा, फक्त CURRENT_ROLE, 'all' आणि 'या युजरची' काढा
            let remainingNotifs = allNotifs.filter(n => 
                n.target !== CURRENT_ROLE && 
                n.target !== 'all' && 
                n.receiver_mobile !== userMobile
            );
            
            localStorage.setItem('system_notifications', JSON.stringify(remainingNotifs));
            loadNotificationsPage();
        }
    </script>
    
    <script src="fcm_setup.js"></script>
</body>
</html>
